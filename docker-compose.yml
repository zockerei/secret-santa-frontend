services:
  frontend:
    image: ghcr.io/zockerei/secret-santa-frontend:latest
    container_name: secret-santa-frontend
    restart: unless-stopped
    pull_policy: always

    environment:
      # The backend on the LAN, nginx forwards /api to it
      BACKEND_URL: ${BACKEND_URL:?Set BACKEND_URL in .env}

    networks:
      br0:
        ipv4_address: ${FRONTEND_IP:?Set FRONTEND_IP in .env}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  br0:
    external: true
